[package]
name = "teamy-mover"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
description = "A read-only move planner with versioned, reviewable plans"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/teamy-mover"
keywords = ["cli", "filesystem", "planning"]
categories = ["command-line-utilities"]
documentation = "https://github.com/TeamDman/teamy-mover" # "https://docs.rs/crate/abc"

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
chrono = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.12"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
vox = { package = "teamy-vox", git = "https://github.com/TeamDman/vox.git", rev = "c5b99b276d12a0ee48078ef1307e0a4f36ca9768", default-features = false, features = ["runtime", "transport-tcp"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "registry",
] }
tracing-tracy = { version = "0.11", optional = true, default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }
tokio = { version = "1.49.0", features = ["full"] }
teamy-cancellation = { version = "=0.8.0", features = ["figue", "arbitrary"] }
facet = { package = "teamy-facet", version = "=0.50.0-rc.7", features = ["uuid", "compact_str", "chrono", "net"] }
facet-csv = { package = "teamy-facet-csv", version = "=0.50.0-rc.9" }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.9" }
facet-pretty = { package = "teamy-facet-pretty", version = "=0.50.0-rc.7" }
figue = { package = "teamy-figue", version = "=6.0.0-rc.5", features = ["arbitrary"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[features]
default = []
extended_observability = []
tracy = ["extended_observability", "dep:tracing-tracy"]

[build-dependencies]
embed-resource = "3.0.6"

[lints.rust]
ambiguous_negative_literals = "warn"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # turn this off periodically to see how bad it has gotten :P
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow" # facet macros use Unicode identifiers
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
